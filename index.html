<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>全场ETF资金监测</title>
  <link rel="stylesheet" href="dashboard-v2.css?v=20261113a" />
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <h1>全场ETF资金监测</h1>
        <p id="freshness">正在读取盘中行情与ETF份额数据…</p>
      </div>
      <div class="top-actions">
        <label class="search"><span>搜索</span><input id="search" placeholder="ETF名称或代码" autocomplete="off" /></label>
        <button id="refresh" class="primary">刷新盘中行情</button>
      </div>
    </header>

    <nav class="tabs" aria-label="视图切换">
      <button class="active" data-view="flow">ETF申购赎回</button>
      <button data-view="rotation">ETF资金轮动</button>
      <button data-view="quote">盘中行情</button>
      <button data-view="star">科创板占比</button>
      <button data-view="chinext">创业板占比</button>
      <button data-view="method">数据口径</button>
    </nav>

    <main>
      <section id="flow-view" class="view active"></section>
      <section id="rotation-view" class="view"></section>
      <section id="star-view" class="view"></section>
      <section id="chinext-view" class="view"></section>
      <section id="quote-view" class="view"></section>
      <section id="method-view" class="view"></section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="dashboard-data.js?v=20261114a"></script>
  <script src="dashboard-metrics.js?v=20261114a"></script>
  <script src="dashboard-views.js?v=20261114a"></script>
</body>
</html>
